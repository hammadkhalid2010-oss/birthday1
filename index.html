<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday QR Greeting</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card greeting-card">
        <p class="tag">Scannable Birthday Greeting</p>
        <h1 id="greeting">🎉 Happy Birthday! 🎂</h1>
        <p id="subtitle">Generate a QR code below to share this greeting with someone special.</p>
      </section>

      <section class="card builder-card">
        <h2>Create a personalized QR link</h2>
        <label for="nameInput">Birthday person&apos;s name</label>
        <div class="input-row">
          <input id="nameInput" type="text" placeholder="e.g., Alex" maxlength="40" />
          <button id="generateButton" type="button">Generate</button>
        </div>

        <div id="result" class="result hidden" aria-live="polite">
          <p class="result-title">Share this link or let them scan the QR code:</p>
          <a id="shareLink" href="#" target="_blank" rel="noopener noreferrer"></a>
          <img id="qrImage" alt="QR code linking to personalized birthday page" />
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
